<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - IT Learning Hub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->

    <nav class="navbar">

        <div class="logo">
            <a href="index.html">
                IT Learning Hub
            </a>
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="register.html">
                Create Account
            </a>

        </div>

    </nav>


    <!-- Login -->

    <main>

        <section class="lesson">

            <h1>Welcome Back</h1>

            <p>
                Login to continue your learning journey.
            </p>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        autocomplete="email"
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        autocomplete="current-password"
                    >

                </div>


                <button type="submit">
                    Login
                </button>

            </form>


            <p id="loginMessage"></p>


            <p>
                Don't have an account?
                <a href="register.html">
                    Create Account
                </a>
            </p>

        </section>


        <a class="back-button" href="index.html">
            ← Back to IT Learning Hub
        </a>

    </main>


    <!-- Supabase -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

    <script src="auth.js"></script>

</body>

</html>
