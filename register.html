<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - IT Learning Hub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🎓 Create Your Account</h1>
        <p>Join IT Learning Hub and start your learning journey.</p>
    </header>


    <main>

        <section class="lesson">

            <h2>Register</h2>

            <form id="registerForm">

                <div class="form-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        required
                        autocomplete="name"
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        autocomplete="email"
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        minlength="6"
                        required
                        autocomplete="new-password"
                    >

                </div>


                <button type="submit">
                    Create Account
                </button>

            </form>


            <p id="registerMessage"></p>


            <p>
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </section>


        <a class="back-button" href="index.html">
            ← Back to IT Learning Hub
        </a>

    </main>


    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Our Supabase configuration -->
    <script src="supabase.js"></script>

    <!-- Registration logic -->
    <script src="auth.js"></script>

</body>

</html>
