<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Networking - IT Learning Hub</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Navigation -->

    <nav class="navbar">

        <div class="logo">

            <a href="index.html">
                IT Learning Hub
            </a>

        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="index.html#learning-paths">
                Learning Paths
            </a>

            <a href="account.html">
                My Account
            </a>

        </div>

    </nav>


    <!-- Main -->

    <main class="section">

        <div class="section-heading">

            <span class="section-label">
                NETWORKING
            </span>

            <h1>
                Networking Fundamentals
            </h1>

            <p>
                Learn the fundamental concepts of computer networking
                step by step.
            </p>

        </div>


        <!-- Level information -->

        <section class="account-card">

            <h2>
                Level 1
            </h2>

            <p>
                Complete the lessons below to build your networking
                foundation.
            </p>

        </section>


        <!-- Lessons -->

        <section>

            <div
                id="lessonsContainer"
                class="learning-grid">

                <p>
                    Loading lessons...
                </p>

            </div>

        </section>


        <!-- Message -->

        <p
            id="networkingMessage"
            style="margin-top: 20px;">
        </p>

    </main>


    <!-- Footer -->

    <footer>

        <p>
            © 2026 IT Learning Hub
        </p>

        <p>
            Learn • Practice • Build
        </p>

    </footer>


    <!-- Supabase -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>

    <script src="supabase.js"></script>


    <!-- Networking logic -->

    <script>

        const lessonsContainer =
            document.getElementById("lessonsContainer");

        const networkingMessage =
            document.getElementById("networkingMessage");


        async function loadLessons() {

            /*
             * Get lessons belonging to
             * Networking Level 1.
             */

            const {
                data: lessons,
                error
            } = await supabaseClient

                .from("lessons")

                .select(`
                    id,
                    lesson_number,
                    title,
                    description
                `)

                .eq("level_id", 1)

                .order("lesson_number");


            /*
             * Handle error
             */

            if (error) {

                console.error(error);

                lessonsContainer.innerHTML = "";

                networkingMessage.textContent =
                    "Unable to load lessons.";

                return;
            }


            /*
             * No lessons
             */

            if (!lessons || lessons.length === 0) {

                lessonsContainer.innerHTML =
                    "<p>No lessons available yet.</p>";

                return;
            }


            /*
             * Create lesson cards
             */

            lessonsContainer.innerHTML = "";


            lessons.forEach((lesson) => {

                const card =
                    document.createElement("a");


                card.className =
                    "learning-card";


                card.href =
                    `lesson.html?id=${lesson.id}`;


                card.innerHTML = `

                    <div class="card-icon">
                        📘
                    </div>

                    <div class="card-content">

                        <span class="level beginner">
                            LESSON ${lesson.lesson_number}
                        </span>

                        <h3>
                            ${lesson.title}
                        </h3>

                        <p>
                            ${lesson.description || ""}
                        </p>

                        <span class="card-link">
                            Start lesson →
                        </span>

                    </div>

                `;


                lessonsContainer.appendChild(card);

            });

        }


        /*
         * Load lessons when page opens.
         */

        loadLessons();

    </script>

</body>

</html>
