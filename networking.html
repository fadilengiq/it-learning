<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Networking - IT Learning Hub</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Navigation -->

    <nav class="navbar">

        <div class="logo">

            <a href="index.html">
                IT Learning Hub
            </a>

        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="index.html#learning-paths">
                Learning Paths
            </a>

            <a href="account.html">
                My Account
            </a>

        </div>

    </nav>


    <!-- Main -->

    <main class="section">

        <div class="section-heading">

            <span class="section-label">
                NETWORKING
            </span>

            <h1>
                Networking Fundamentals
            </h1>

            <p>
                Learn the fundamental concepts of computer networking
                step by step.
            </p>

        </div>


        <!-- Level information -->

        <section class="account-card">

            <h2>
                Level 1
            </h2>

            <p>
                Complete the lessons below to build your networking
                foundation.
            </p>

        </section>


        <!-- Lessons -->

        <section>

            <div
                id="lessonsContainer"
                class="learning-grid">

                <p>
                    Loading lessons...
                </p>

            </div>

        </section>


        <!-- Message -->

        <p
            id="networkingMessage"
            style="margin-top: 20px;">
        </p>

    </main>


    <!-- Footer -->

    <footer>

        <p>
            © 2026 IT Learning Hub
        </p>

        <p>
            Learn • Practice • Build
        </p>

    </footer>


    <!-- Supabase -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>

    <script src="supabase.js"></script>


    <!-- Networking logic -->

<script>

    const LEVEL_ID = 1;

    const lessonsContainer =
        document.getElementById("lessonsContainer");

    const networkingMessage =
        document.getElementById("networkingMessage");


    async function loadLessons() {

        /*
         * Get authenticated user
         */

        const {
            data: { user },
            error: userError
        } = await supabaseClient.auth.getUser();


        if (userError || !user) {

            window.location.href = "login.html";

            return;

        }


        /*
         * Get lessons belonging to
         * Networking Level 1
         */

        const {
            data: lessons,
            error: lessonsError
        } = await supabaseClient

            .from("lessons")

            .select(`
                id,
                lesson_number,
                title,
                description
            `)

            .eq("level_id", LEVEL_ID)

            .order("lesson_number");


        if (lessonsError) {

            console.error(lessonsError);

            lessonsContainer.innerHTML = "";

            networkingMessage.textContent =
                "Unable to load lessons.";

            return;

        }


        if (!lessons || lessons.length === 0) {

            lessonsContainer.innerHTML =
                "<p>No lessons available yet.</p>";

            return;

        }


        /*
         * Get completed lessons
         * for the current user
         */

        const {
            data: progress,
            error: progressError
        } = await supabaseClient

            .from("lesson_progress")

            .select("lesson_id, completed")

            .eq("user_id", user.id)

            .eq("completed", true);


        if (progressError) {

            console.error(progressError);

            networkingMessage.textContent =
                "Unable to load your learning progress.";

            return;

        }


        /*
         * Create a Set containing
         * completed lesson IDs
         */

        const completedLessonIds =
            new Set(
                (progress || [])
                    .map(item => item.lesson_id)
            );


        /*
         * Calculate progress
         */

        const totalLessons =
            lessons.length;

        const completedLessons =
            lessons.filter(
                lesson =>
                    completedLessonIds.has(lesson.id)
            ).length;


        const percentage =
            totalLessons > 0
                ? Math.round(
                    (completedLessons / totalLessons) * 100
                )
                : 0;


        /*
         * Display progress
         */

        networkingMessage.textContent =
            `${completedLessons} of ${totalLessons} lessons completed (${percentage}%).`;


        /*
         * Create lesson cards
         */

        lessonsContainer.innerHTML = "";


        lessons.forEach((lesson) => {

            const card =
                document.createElement("a");


            card.className =
                "learning-card";


            card.href =
                `lesson.html?id=${lesson.id}`;


            const completed =
                completedLessonIds.has(lesson.id);


            card.innerHTML = `

                <div class="card-icon">
                    ${completed ? "✅" : "📘"}
                </div>

                <div class="card-content">

                    <span class="level beginner">
                        LESSON ${lesson.lesson_number}
                    </span>

                    <h3>
                        ${escapeHtml(lesson.title)}
                    </h3>

                    <p>
                        ${escapeHtml(
                            lesson.description || ""
                        )}
                    </p>

                    <span class="card-link">
                        ${
                            completed
                                ? "Review lesson →"
                                : "Start lesson →"
                        }
                    </span>

                </div>

            `;


            lessonsContainer.appendChild(card);

        });


        /*
         * Add Final Exam section
         */

        const examSection =
            document.createElement("section");


        examSection.className =
            "account-card";


        if (completedLessons === totalLessons) {

            examSection.innerHTML = `

                <h2>
                    🎓 Level 1 Final Exam
                </h2>

                <p>
                    Congratulations! You have completed
                    all Level 1 lessons.
                </p>

                <a
                    href="exam.html"
                    class="primary-button">

                    Start Final Exam →

                </a>

            `;

        } else {

            const remaining =
                totalLessons - completedLessons;


            examSection.innerHTML = `

                <h2>
                    🔒 Level 1 Final Exam
                </h2>

                <p>
                    Complete all ${totalLessons} lessons
                    before taking the final exam.
                </p>

                <p>
                    Remaining:
                    <strong>
                        ${remaining}
                    </strong>
                    lesson${remaining === 1 ? "" : "s"}.
                </p>

            `;

        }


        /*
         * Put exam section after
         * the lesson cards
         */

        lessonsContainer.parentElement
            .insertAdjacentElement(
                "afterend",
                examSection
            );

    }


    /*
     * Escape HTML
     */

    function escapeHtml(value) {

        const div =
            document.createElement("div");

        div.textContent =
            value ?? "";

        return div.innerHTML;

    }


    /*
     * Load page
     */

    loadLessons();

</script>

</body>

</html>
